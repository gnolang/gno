{{ define "layouts/head" }}

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ .Title }}</title>

  <!-- Preload. Deliberately unversioned: a preload is claimed only by a request
       for the very same URL, and the request for a font comes from the @font-face
       rule in main.css, which names the file with no version. Appending one here
       leaves the preload unclaimed and fetches the font a second time. Versioning
       a font means changing the URL main.css emits, which is a build concern. -->
  <link rel="preload" href="{{ .AssetsPath }}fonts/intervar/Intervar.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="{{ .AssetsPath }}fonts/roboto/roboto-mono-normal.woff2" as="font" type="font/woff2"
    crossorigin />

  <!-- Meta description -->
  <meta name="description" content="{{ .Description }}" />

  <!-- Canonical URL -->
  {{ if .Canonical }}
  <link rel="canonical" href="{{ .Canonical }}" />
  {{ end }}

  <!-- Open Graph metadata -->
  <meta property="og:title" content="{{ .Title }}" />
  <meta property="og:description" content="{{ .Description }}" />
  <meta property="og:image" content="{{ .Image }}" />
  <meta property="og:url" content="{{ .URL }}" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card metadata -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{ .Title }}" />
  <meta name="twitter:description" content="{{ .Description }}" />
  <meta name="twitter:image" content="{{ .Image }}" />

  <!-- Favicon -->
  <link rel="icon" href="{{ .AssetsPath }}favicon.ico?v={{ .AssetsVersion }}" type="image/x-icon" />

  <!-- Robots meta tag -->
  <meta name="robots" content="index, follow" />

  <!-- chroma stylesheet -->
  <link rel="stylesheet" href="{{ .ChromaPath }}?v={{ .AssetsVersion }}" />

  <!-- web assets -->
  <link rel="stylesheet" href="{{ .AssetsPath }}main.css?v={{ .AssetsVersion }}" />

  <!-- wallet integrations -->
  <meta name="gnoconnect:rpc" content="{{ .Remote }}" />
  <meta name="gnoconnect:chainid" content="{{ .ChainId }}" />
</head>
{{ end }}
