{{ define "ui/banner" -}}
{{ if .Enabled -}}
{{ if .HasURL -}}
<a href="{{ .URL }}" target="_blank" rel="noopener noreferrer" class="b-banner{{ if .IsWarning }} b-banner--warning{{ end }}">
  <span>{{ render . }}</span>
</a>
{{ else -}}
<div class="b-banner{{ if .IsWarning }} b-banner--warning{{ end }}">
  <span>{{ render . }}</span>
</div>
{{ end -}}
{{ end -}}
{{ end }}
