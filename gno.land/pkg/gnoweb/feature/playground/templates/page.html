{{/* ===================================================================================
LAYOUT - Playground view
=================================================================================== */}}
{{ define "renderPage" }}
<!-- Playground Content -->
<div class="b-playground" data-controller="playground"
  data-playground-domain-value="{{ .Domain }}"
  {{ with .DefaultFile }}data-playground-default-file-value="{{ . }}"{{ end }}>

  <!-- Header -->
  <header class="b-content-header">
    <h1 class="title b-content-h1">Playground</h1>
    <div class="header-info">
      <div class="b-btns">
        <button type="button" class="b-inline-btn c-with-icon" data-action="click->playground#shareCode" title="Copy a link to this code">
          <svg class="c-icon"><use href="#ico-link"></use></svg>
          <span>Share</span>
        </button>
        <button type="button" class="b-inline-btn c-with-icon" data-action="click->playground#downloadFiles" title="Download file(s)">
          <svg class="c-icon"><use href="#ico-ddl"></use></svg>
          <span>Download</span>
        </button>
        <button type="button" class="b-btn b-btn--primary c-with-icon" data-action="click->playground#runCode" title="Run code (Ctrl/Cmd+Enter)">
          <svg class="c-icon"><use href="#ico-run-code"></use></svg>
          <span>Run</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Editor Area -->
  <div class="b-code-editor-area">
    <!-- File tabs -->
    <div class="b-playground-tabs-wrap" data-playground-target="tabs-wrap">
      <div class="b-playground-tabs u-no-scrollbar" data-playground-target="tabs">
      </div>
      <div class="b-playground-tabs-actions">
        <button type="button" class="b-playground-tabs-nav"
          data-playground-target="prev-button"
          data-action="click->playground#scrollTabsPrev"
          title="Scroll tabs left" aria-label="Scroll tabs left" hidden>
          <svg class="c-icon"><use href="#ico-arrow-left"></use></svg>
        </button>
        <button type="button" class="b-playground-tabs-nav"
          data-playground-target="next-button"
          data-action="click->playground#scrollTabsNext"
          title="Scroll tabs right" aria-label="Scroll tabs right" hidden>
          <svg class="c-icon"><use href="#ico-arrow-right"></use></svg>
        </button>
        <button type="button" class="b-playground-tab-add"
          data-action="click->playground#addFile"
          title="Add file" aria-label="Add file">+</button>
      </div>
    </div>

    <!-- Code editor -->
    <div class="b-code-editor" data-playground-target="editor"></div>
    <textarea data-playground-target="initial-code" hidden>{{ .InitialCode }}</textarea>
  </div>

  <!-- Output Area -->
  <section class="b-result">
    <h2 class="b-result-title">Output</h2>
    <div class="b-code">
      <div class="b-result-content" role="status" aria-live="polite" data-playground-target="output"></div>
    </div>
  </section>
</div>
{{ end }}
