name: ci / codegen-verify

on:
  push:
    branches:
      - master
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "misc/genproto2/**"
      - "tm2/pkg/bft/privval/upstream/upstreampb/**"
      - "docs/**"
      - ".github/workflows/ci-codegen-verify.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "misc/genproto2/**"
      - "tm2/pkg/bft/privval/upstream/upstreampb/**"
      - "docs/**"
      - ".github/workflows/ci-codegen-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod-tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make tidy VERIFY_MOD_SUMS=true

  upstreampb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt update && sudo apt install -y libprotobuf-dev protobuf-compiler
      - run: make -C misc/devdeps install
      - run: |
          make -C tm2/pkg/bft/privval/upstream/upstreampb
          git diff --text --exit-code || (echo "upstream.pb.go is not updated, please run 'make -C tm2/pkg/bft/privval/upstream/upstreampb'." && exit 1)

  genproto2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          make -C misc/genproto2
          git diff --text --exit-code || (echo "Some pb3_gen.go files are not updated, please run 'make -C misc/genproto2'." && exit 1)

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - working-directory: docs/
        run: make generate -B
      - run: |
          diff=$(git status --porcelain)
          if [[ $diff ]]; then
              echo "Please run 'make generate' in docs/."
              exit 1
          fi
      - working-directory: docs/
        run: make lint
