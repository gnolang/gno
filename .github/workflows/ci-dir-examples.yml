name: ci / examples

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - gnovm/**
      - examples/**
      - misc/deployments/**
      - contribs/gnogenesis/**
      - .github/workflows/ci-dir-examples.yml
      # *.md is prose, except in the gno source trees where it is valid
      # mempackage content (see gnovm/pkg/gnolang/mempackage.go goodFileXtns)
      # and is therefore linted/tested here.
      # Order matters: a later positive pattern wins over an earlier negation.
      - '!**/*.md'
      - examples/**/*.md
      - gnovm/stdlibs/**/*.md
      # A package-local integration script is not mempackage content and is not
      # linted or run by this suite; the suite that runs them is ci-dir-gnoland.
      # Excluding it keeps a gas-number refresh from paying for this workflow too.
      - '!examples/**/*.txtar'
  workflow_dispatch:
    inputs:
      debug:
        description: Enable debug mode for gno test
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gno2go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go install -v ./gnovm/cmd/gno
      - run: go run ./gnovm/cmd/gno tool transpile -C examples -v --gobuild .

  gno-checks:
    uses: ./.github/workflows/_ci-gno.yml
    with:
      debug: ${{ inputs.debug || false }}
      path: "examples"

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - working-directory: examples
        run: |
          if make -qp | grep -q '^generate:'; then
            make generate
            if [ "$(git status -s)" != "" ]; then
              echo "'make generate' creates files that differ from the git tree, please run 'make generate' and commit:"
              git status -s
              git diff
              exit 1
            fi
          else
            echo "'make generate' rule not found, skipping."
          fi

  mod-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - working-directory: ./examples
        run: |
          make tidy
          git diff --exit-code || (echo "Some gnomod.toml files are not tidy, please run 'make tidy'." && exit 1)
