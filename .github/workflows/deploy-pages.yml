# generate Go docs and publish on gh-pages branch
# Live at: https://gnolang.github.io/gno
name: deploy / pages

on:
  # No path filter on push: this is what actually publishes gh-pages.
  push:
    branches:
      - master
  # On pull requests the `deploy` job and the artifact upload are skipped
  # (see the `if:` conditions below), so `build` only proves the generators
  # still work. Restrict it to what they read.
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/deploy-pages.yml
      - misc/gendocs/**
      - misc/stdlib_diff/**
      - gnovm/stdlibs/**
      - '**/*.go'
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'gnolang/gno' # Alternatively, validate based on provided tokens and permissions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The stdlib_diff baseline is pinned explicitly rather than inherited from
      # go.mod. The report answers "how far has gno drifted from upstream Go",
      # so the Go version it compares against is a deliberate editorial choice
      # and must not move silently when the repo's build toolchain is bumped.
      # Keep this in sync with misc/stdlib_diff/README.md when bumping.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.1"
      - run: echo "GOROOT_SAVE=$(go env GOROOT)" >> "$GITHUB_ENV"
      - run: |
          got=$(go env GOVERSION)
          echo "stdlib_diff baseline: $got"
          case "$got" in
            go1.26.1*) ;;
            *) echo "::error::expected the stdlib_diff baseline to be go1.26.1, got $got"; exit 1 ;;
          esac
      # Everything after this point builds with the repo's own toolchain.
      # GOROOT_SAVE, captured above, keeps pointing at the pinned baseline, so
      # the diff tool is built with go.mod's Go but compares against 1.26.1.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: "cd misc/stdlib_diff && make gen"
      - run: "cd misc/gendocs && make install gen"
      - run: "mkdir -p pages_output/stdlib_diff"
      - run: |
          cp -r misc/gendocs/godoc/* pages_output/
          cp -r misc/stdlib_diff/stdlib_diff/* pages_output/stdlib_diff/

      # These two last steps will be skipped on pull requests
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: ./pages_output

  deploy:
    if: >
      github.repository == 'gnolang/gno' &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write # to deploy to GitHub Pages
      id-token: write # for OIDC token used by actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
