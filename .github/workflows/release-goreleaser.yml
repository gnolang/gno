# Unified release workflow: master push releases + nightly scheduled releases.
# Replaces the old releaser-master.yml and releaser-nightly.yml.
name: release / goreleaser

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 0 * * 2-6" # nightly Tue-Sat
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Build as snapshot (no publish)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create GitHub releases
      id-token: write # for keyless signing via sigstore/cosign
      packages: write # to push images to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Dummy tag needed for goreleaser on non-tag pushes (non-snapshot runs)
      - name: Create a dummy tag to avoid goreleaser failure
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.snapshot != true)
        run: git tag v0.0.0 master

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # zizmor: cache-poisoning — goreleaser publishes artifacts from this job

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Determine release args
        id: args
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUTS_SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$INPUTS_SNAPSHOT" = "true" ]; then
            echo "goreleaser-args=release --clean --nightly --snapshot --config ./.github/goreleaser.yaml" >> "$GITHUB_OUTPUT"
            echo "tag-version=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "goreleaser-args=release --clean --nightly --config ./.github/goreleaser.yaml" >> "$GITHUB_OUTPUT"
            echo "tag-version=master" >> "$GITHUB_OUTPUT"
          fi

      # These builds are never releases, so the version compiled in must not
      # parse: a parseable one (the dummy v0.0.0 tag used to leak in) would
      # satisfy a governance halt_min_version. Same shape as gno.land/Makefile's
      # off-tag fallback, pinned by
      # gno.land/pkg/gnoland.TestReleaseToolingMatchesTheParser.
      - name: Compute build version
        id: build_version
        run: |
          BRANCH=$(git branch --show-current)
          echo "version=${BRANCH:-HEAD}.$(git rev-list --count HEAD)+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser-pro
          version: ~> v2
          args: ${{ steps.args.outputs.goreleaser-args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }} # zizmor: ignore[secrets-outside-env]
          TAG_VERSION: ${{ steps.args.outputs.tag-version }}
          BUILD_VERSION: ${{ steps.build_version.outputs.version }}
