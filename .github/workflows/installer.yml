# Run misc/install.sh the way the docs tell a user to run it.
#
# The one-liner in docs/builders/install.md is this project's front door, and
# nothing here exercised it. Every part of it depends on state no unit test can
# see: that a v* Release object exists (not just a v* git tag), that its assets
# are named what the script greps for, and that those binaries run on a machine
# that is not the builder. All three have broken in production without a single
# check going red. The documented install failed for every user, on every
# platform, for as long as it took someone to try it by hand.
#
# So this job downloads and runs the real thing against the real release. It is
# slow and it talks to the network on purpose: a hermetic test of this script
# would only re-assert the assumptions that were wrong.
name: installer

on:
  push:
    branches: [master]
    paths:
      - misc/install.sh
      - misc/uninstall.sh
      - .github/workflows/installer.yml
  pull_request:
    paths:
      - misc/install.sh
      - misc/uninstall.sh
      - .github/workflows/installer.yml
  # Publishing a release, or tagging without publishing one, breaks this
  # without any commit landing here, so a schedule is the only trigger that
  # catches it before a user does.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  binaries:
    name: prebuilt binaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # The script reads this by name to lift the 60-requests/hour anonymous
      # API limit. Shared-IP runners hit that limit routinely.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install with the documented defaults
        run: sh misc/install.sh --dir "$HOME/gnobin"

      - name: The binaries must exist, report a v* tag, and agree on it
        # Outside the checkout on purpose. gnoenv resolves GNOROOT by asking
        # `go list` about the current directory's module before it falls back to
        # the path baked into the binary, so a gno that cannot find its stdlib
        # answers every question correctly while cwd is inside this repo.
        working-directory: ${{ runner.temp }}
        run: |
          BIN="$HOME/gnobin"
          for b in gno gnokey gnodev gnoweb; do
            if [ ! -x "$BIN/$b" ]; then
              echo "::error::$b was not installed into $BIN"
              exit 1
            fi
          done

          # "latest" resolving to a chain/* release, whose assets this script
          # cannot match, is the exact regression that motivated this workflow.
          # Assert the shape of the tag, not just that something installed.
          ver="$("$BIN/gno" version | awk '{print $NF}')"
          case "$ver" in
            v[0-9]*) echo "installed $ver" ;;
            *) echo "::error::gno reports '$ver'; expected a v* release tag"; exit 1 ;;
          esac

          # gnoweb and gnodev have no version subcommand to ask.
          got="$("$BIN/gnokey" version | awk '{print $NF}')"
          if [ "$got" != "$ver" ]; then
            echo "::error::gnokey reports '$got', gno reports '$ver'; mismatched assets"
            exit 1
          fi

      - name: gno must find its own stdlib, with GNOROOT unset
        working-directory: ${{ runner.temp }}
        run: |
          # A binary built with -trimpath installs cleanly and reports its
          # version fine, then panics the moment it has to compile anything,
          # because it cannot work out where its standard library is. That is
          # how the chain/mainnet assets shipped. Compiling something is the
          # only check that catches it, and GNOROOT stays unset on purpose:
          # setting it here would hide precisely the bug being looked for.
          mkdir -p "$RUNNER_TEMP/smoke"
          printf 'package main\n\nfunc main() {\n\tprintln("installer-ok")\n}\n' \
            > "$RUNNER_TEMP/smoke/main.gno"
          out="$("$HOME/gnobin/gno" run "$RUNNER_TEMP/smoke/main.gno" 2>&1)"
          if [ "$out" != "installer-ok" ]; then
            echo "::error::gno run printed '$out'"
            exit 1
          fi

      - name: uninstall.sh must leave nothing behind
        run: |
          sh misc/uninstall.sh --dir "$HOME/gnobin"
          for b in gno gnokey gnodev gnoweb; do
            if [ -e "$HOME/gnobin/$b" ]; then
              echo "::error::$b survived uninstall"
              exit 1
            fi
          done

      - name: --full must add the node
        run: |
          sh misc/install.sh --dir "$HOME/gnofull" --full
          if [ ! -x "$HOME/gnofull/gnoland" ]; then
            echo "::error::--full did not install gnoland"
            exit 1
          fi
          # Outside the checkout, for the GNOROOT reason above.
          (cd "$RUNNER_TEMP" && "$HOME/gnofull/gnoland" version)

      - name: The awk JSON fallback must work as well as jq
        run: |
          # jq is preinstalled on every runner, so the awk path this script
          # carries for machines without it is otherwise never executed, and
          # it parses the same GitHub JSON by hand. Redo the install without it.
          #
          # A PATH that omits jq, not a deletion: the macOS image ships one at
          # /usr/bin/jq on a read-only volume, so removing it is not possible
          # even with sudo. Same symlink farm as the wget job below.
          mkdir -p "$HOME/nojq"
          for d in /usr/local/bin /opt/homebrew/bin /usr/bin /bin /usr/sbin /sbin; do
            [ -d "$d" ] || continue
            for f in "$d"/*; do
              [ -e "$f" ] || continue
              b="${f##*/}"
              # Not `[ ... ] && continue`: a false test is a failing command,
              # and these steps run under `bash -e`.
              if [ "$b" = jq ]; then continue; fi
              [ -e "$HOME/nojq/$b" ] || ln -s "$f" "$HOME/nojq/$b"
            done
          done
          if PATH="$HOME/nojq" command -v jq >/dev/null 2>&1; then
            echo "::error::jq is still reachable; this step tested nothing"
            exit 1
          fi
          PATH="$HOME/nojq" /bin/sh misc/install.sh --dir "$HOME/gnoawk"
          got="$(cd "$RUNNER_TEMP" && "$HOME/gnoawk/gno" version | awk '{print $NF}')"
          case "$got" in
            v[0-9]*) echo "awk fallback installed $got" ;;
            *) echo "::error::awk fallback resolved '$got'"; exit 1 ;;
          esac

  wget:
    name: prebuilt binaries (wget, no curl)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install with curl hidden
        run: |
          # The wget branch is a separate implementation of every HTTP call,
          # including parsing a redirect out of response headers by hand and
          # staging the bearer token in a file. curl exists on both runner
          # images, so that branch never runs unless it is forced to.
          #
          # A symlink farm rather than deleting /usr/bin/curl: the rest of the
          # job, and the runner's own cleanup, still have curl.
          mkdir -p "$HOME/nocurl"
          for d in /usr/local/bin /usr/bin /bin /usr/sbin /sbin; do
            [ -d "$d" ] || continue
            for f in "$d"/*; do
              [ -e "$f" ] || continue
              b="${f##*/}"
              # Not `[ ... ] && continue`: a false test is a failing command,
              # and these steps run under `bash -e`.
              if [ "$b" = curl ]; then continue; fi
              [ -e "$HOME/nocurl/$b" ] || ln -s "$f" "$HOME/nocurl/$b"
            done
          done
          if PATH="$HOME/nocurl" command -v curl >/dev/null 2>&1; then
            echo "::error::curl is still reachable; this job tested nothing"
            exit 1
          fi
          PATH="$HOME/nocurl" /bin/sh misc/install.sh --dir "$HOME/gnowget"

      - name: The wget path must produce the same binaries
        working-directory: ${{ runner.temp }}
        run: |
          got="$("$HOME/gnowget/gno" version | awk '{print $NF}')"
          case "$got" in
            v[0-9]*) echo "wget path installed $got" ;;
            *) echo "::error::wget path resolved '$got'"; exit 1 ;;
          esac

  from-source:
    name: --from-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build and install from source
        run: |
          # The documented fallback for anything the binary path cannot serve,
          # and the path gnolang/getting-started and gnolang/repo-template use
          # in their own CI. It clones master and runs make install, so it is
          # slow, but it is also the recommendation handed to every user the
          # binary path fails, and it deserves to be known to work.
          sh misc/install.sh --from-source --dir "$HOME/gnosrc" --full

      - name: A source build must run the same smoke test
        working-directory: ${{ runner.temp }}
        run: |
          for b in gno gnokey gnodev gnobro gnoweb gnoland; do
            if [ ! -x "$HOME/gnosrc/$b" ]; then
              echo "::error::--from-source did not install $b"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/smoke"
          printf 'package main\n\nfunc main() {\n\tprintln("installer-ok")\n}\n' \
            > "$RUNNER_TEMP/smoke/main.gno"
          out="$("$HOME/gnosrc/gno" run "$RUNNER_TEMP/smoke/main.gno" 2>&1)"
          if [ "$out" != "installer-ok" ]; then
            echo "::error::gno run printed '$out'"
            exit 1
          fi
