name: meta / gh / assign

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [ opened, reopened ]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  assign-author:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # to auto-assign the PR author
    steps:
      - uses: toshimaru/auto-author-assign@415448809ea5ba0e171b251632720b009df3d8d6 # v3.1.1
