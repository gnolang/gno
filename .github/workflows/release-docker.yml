# Build and Push Docker Images using Docker Bake
name: release / docker

# Images are built from version tags only. A branch push used to build a
# floating chain-<name> image whose version string satisfies no
# halt_min_version and which operators nevertheless pulled; and a chain/<name>
# launch tag would recreate that name for an image reporting a different
# version. A runnable node image is always a vX.Y.Z tag (RELEASING.md).
#
# No workflow_dispatch: a manual run would build a published version again,
# attested and signed under a branch's identity rather than the tag's, which
# RELEASING.md's verify commands refuse. A workflow fault shows up on the
# release candidate, cut on the same commit first, and is fixed in the next
# candidate. Do not re-run a published release's run either: these builds
# are not reproducible, so the new artifacts would no longer match the
# checksums and digests the upgrade ledgers record.
on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  bake:
    strategy:
      matrix:
        # `latest` only for the CLI tools: a node image that moves by itself
        # breaks coordinated upgrades (RELEASING.md, "Container images").
        include:
          - { image: gnoland, latest: false }
          - { image: gnokey, latest: true }
          - { image: gnoweb, latest: true }
          - { image: gno, latest: true }
          - { image: gnofaucet, latest: false }
          - { image: gnodev, latest: true }
          - { image: gnocontribs, latest: false }
          - { image: gpao, latest: false }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # kept in case type=gha is re-enabled; not required by type=registry
      packages: write # to push images to ghcr.io
      id-token: write # to sign the images (keyless, sigstore)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Every tag, for the ordering below; blob:none keeps that cheap.
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether this is the highest release
        id: release_order
        run: |
          # `latest` may only move forward. Gate it on being the highest final
          # v* tag, not merely a final one: a backport cut after a newer line
          # must not re-point latest at the older line.
          HIGHEST=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname | grep -v -- '-' | head -1 || true)
          echo "is_highest=$([ -n "$HIGHEST" ] && [ "$HIGHEST" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Tags: the git tag itself, the built commit's sha,
      # and `latest` for the images the matrix marks, only when this tag is the
      # highest final release. The action's own default adds `latest` to every
      # tag build, gnoland included, so it is turned off and the raw rule below
      # is the only `latest` published. See RELEASING.md, "Container images".
      - name: Extract metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ matrix.latest && steps.release_order.outputs.is_highest == 'true' }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.authors=Gno Core Team

      # Installed before anything is pushed: an installer failure after the push
      # would leave published images with no signature.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Bake build and push
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          # The tag that triggered the run, verbatim, never a version derived
          # from the checkout: a final release shares its last candidate's
          # commit. Pinned by gno.land/pkg/gnoland.TestReleaseToolingMatchesTheParser.
          BUILD_VERSION: ${{ github.ref_name }}
        with:
          source: . # use checked-out code, not git URL at GITHUB_SHA
          files: |
            misc/deployments/bake/docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-tags }}
            cwd://${{ steps.meta.outputs.bake-file-labels }}
          push: true
          targets: ${{ matrix.image }}
          # type=registry is used instead of type=gha because GHA cache blob
          # entries are global (not scoped). When matrix jobs export concurrently,
          # they race on the shared blob namespace, corrupting each other's cache.
          # type=registry gives each image a fully independent OCI cache manifest.
          set: |
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository }}/cache:${{ matrix.image }}
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository }}/cache:${{ matrix.image }},mode=max
            *.context=.

      # Keyless signature on the pushed image, by digest, so `cosign verify`
      # can tie ghcr.io/gnolang/gno/<tool>:vX.Y.Z to this workflow and tag
      # (RELEASING.md, "Signing and provenance"). --recursive signs every
      # manifest in the multi-arch index as well as the index itself: each
      # platform image, and buildx's provenance and SBOM manifests. A host
      # pulls the manifest for its platform, and a check made against that
      # digest finds no signature on the index alone.
      - name: Sign the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          DIGEST: ${{ fromJSON(steps.bake.outputs.metadata)[matrix.image]['containerimage.digest'] }}
        run: |
          [ -n "${DIGEST}" ] || { echo "::error::bake reported no digest for ${IMAGE}"; exit 1; }
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
