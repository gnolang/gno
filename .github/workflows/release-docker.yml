# Build and Push Docker Images using Docker Bake
name: release / docker

# Images are built from tags only. A branch push used to build a floating
# chain-<name> image whose version string satisfies no halt_min_version and
# which operators nevertheless pulled; a release is a tag, so the image is too.
on:
  push:
    tags:
      - chain/*
      # Release tags: VALIDATOR.md points operators at ghcr.io for upgrade
      # images, and every coordinated upgrade is a v* tag.
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.3.0)"
        required: true

permissions:
  contents: read

jobs:
  bake:
    strategy:
      matrix:
        image: [gnoland,gnokey,gnoweb,gno,gnofaucet,gnodev,gnocontribs,gpao]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # kept in case type=gha is re-enabled; not required by type=registry
      packages: write # to push images to ghcr.io
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Compute build version
        id: build_version
        run: |
          # Prefer the release tag: a launch commit carries both chain/<name>
          # and v<X.Y.Z>, and only the latter is a version the node can order.
          # The branch fallback deliberately produces something unparseable —
          # a branch build must not satisfy an upgrade gate.
          BRANCH=$(git branch --show-current)
          V=$(git describe --tags --exact-match --match 'v*' 2>/dev/null \
              || git describe --tags --exact-match 2>/dev/null \
              || echo "${BRANCH:-HEAD}.$(git rev-list --count HEAD)+$(git rev-parse --short HEAD)")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # The sha of what is built. docker/metadata-action's type=sha would
          # label the image with the event's sha instead, which on a dispatch
          # is the default branch's tip, not the tag being built.
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve image tag
        id: resolve_tag
        run: |
          INPUT="${INPUTS_TAG}"
          if [ -n "$INPUT" ]; then
            # chain/gnolang1.2 → chain-gnolang1.2
            echo "tag=${INPUT/\//-}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
        env:
          INPUTS_TAG: ${{ inputs.tag }}

      # Tags: the git tag itself, the dispatch input, the built commit's sha,
      # and `latest` only for the CLI tools on a final release. A node image
      # that moves by itself breaks coordinated upgrades (a validator restarting
      # between "release built" and "halt height" would pull a binary the gate
      # refuses), and a pre-release must not become what developers get by
      # default. The action's own default adds `latest` to every tag build,
      # gnoland included, so it is turned off and the raw rule below is the only
      # `latest` published. See RELEASING.md, "Container images".
      - name: Extract metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.resolve_tag.outputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=sha-${{ steps.build_version.outputs.short_sha }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && contains(fromJSON('["gno","gnokey","gnodev","gnoweb"]'), matrix.image) }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.authors=Gno Core Team

      - name: Bake build and push
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          BUILD_VERSION: ${{ steps.build_version.outputs.version }}
        with:
          source: . # use checked-out code, not git URL at GITHUB_SHA
          files: |
            misc/deployments/bake/docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-tags }}
            cwd://${{ steps.meta.outputs.bake-file-labels }}
          push: true
          targets: ${{ matrix.image }}
          # type=registry is used instead of type=gha because GHA cache blob
          # entries are global (not scoped). When matrix jobs export concurrently,
          # they race on the shared blob namespace, corrupting each other's cache.
          # type=registry gives each image a fully independent OCI cache manifest.
          set: |
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository }}/cache:${{ matrix.image }}
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository }}/cache:${{ matrix.image }},mode=max
            *.context=.
