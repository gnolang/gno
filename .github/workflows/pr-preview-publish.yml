# Publishes the snapshot built by pr-preview.yml and posts the sticky comment.
#
# This is the PRIVILEGED half. It deliberately never checks out the pull request's code
# and never runs anything from it: it downloads the artifact, copies its files into the
# gnolang/gno-previews repository, and posts a comment that the default branch's own
# gnopreview builds from the artifact's preview.json.
#
# The artifact is still the pull request's work: its pages carry whatever script a gnoweb
# change ships, and it is served from gnolang.github.io, the origin every gnolang Pages
# site shares. So publishing is split on who is asking:
#
#   resolve  holds no secret. Works out which pull request this is from the run
#            metadata, and whether both its author and whoever triggered the run can
#            write to this repository.
#   publish  holds the deploy key, which lives only in two environments:
#              gno-previews         no reviewers; used when both can write
#              gno-previews-review  required reviewers; everyone else, forks included
#            A maintainer approving the deployment is the review. It is separate from
#            approving a fork's CI run, which only lets the untrusted half render.
#
# Previews live in their own repository so that publishing one is a single incremental
# push. A GitHub Pages site built by an Actions workflow — like this repository's godoc
# site — has no incremental deploy, so sharing it would rebuild and re-upload the whole
# documentation mirror for every preview. See gnolang/gno-previews/README.md.
name: pr / preview publish

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [pr / preview]
    types: [completed]

permissions: {}

# Keyed per pull request, not globally: GitHub queues at most ONE pending run per
# concurrency group, so a third arrival silently CANCELS the one waiting — observed as a
# pull request whose preview published and whose comment never appeared. Concurrent
# pushes to the previews repository are handled by the replay loop below instead.
concurrency:
  group: >-
    pr-preview-publish-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  PREVIEWS_REPO: gnolang/gno-previews

jobs:
  resolve:
    # workflow_run matches on the workflow's name, and a pull request can add a workflow
    # of its own called "pr / preview". The path is where the run's definition came from;
    # a look-alike has a different one. (A pull request can still edit pr-preview.yml
    # itself, which is why the gate below exists and this is not it.)
    if: >
      vars.GNOWEB_PREVIEW_BASE_URL != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/pr-preview.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # to find the pull request behind the run
      actions: read # to read the review environment's protection rules
    outputs:
      pr: ${{ steps.meta.outputs.pr }}
      environment: ${{ steps.trust.outputs.environment }}
    steps:
      # NEVER take the pull request number from the artifact: the render job runs
      # the fork's own copy of pr-preview.yml, so a malicious pull request could
      # name any number and this job would replace that pull request's preview
      # and PATCH its comment. Resolve it from the workflow_run payload, which
      # the fork does not control. (workflow_run.pull_requests is empty for fork
      # heads, hence the lookup.)
      - name: Resolve the pull request from the trusted run metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # -f, not string interpolation into the query: a branch name is
          # whatever the fork calls it, "&" and all, and `git check-ref-format`
          # accepts both. Pasted in raw, "zzz&head=<owner>%3A<victim-branch>"
          # appends a second head= that the REST API honours over the first,
          # and a legitimate "fix/a&b" simply truncates the filter and silently
          # previews nothing. gh percent-encodes the value.
          #
          # Not repos/{owner}/{repo}/commits/{sha}/pulls, which looks tidier and
          # returns [] for a fork head — verified against an open fork PR — and
          # forks are the case this whole split exists for.
          prs=$(gh api -X GET "repos/$REPO/pulls" \
                  -f state=open -f per_page=100 -f "head=$HEAD_OWNER:$HEAD_BRANCH" \
                  --jq '.[] | "\(.number) \(.head.sha) \(.user.login)"')
          n=$(printf '%s\n' "$prs" | grep -c . || true)
          if [ "$n" -eq 0 ]; then
            echo "no open pull request for $HEAD_OWNER:$HEAD_BRANCH — closed while rendering; nothing to publish"
            exit 0
          fi
          if [ "$n" -gt 1 ]; then
            echo "::error::$n open pull requests share head $HEAD_OWNER:$HEAD_BRANCH; refusing to guess"
            exit 1
          fi
          read -r pr sha author <<< "$prs"
          if [ "$sha" != "$HEAD_SHA" ]; then
            echo "PR #$pr has moved to $sha since this run ($HEAD_SHA) — a newer run will publish"
            exit 0
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"

      # Both the author and the triggering actor, because either can put code in
      # the snapshot: a maintainer's "Update branch" on an outsider's pull request
      # makes the maintainer the actor, and an outsider pushing to a maintainer's
      # fork makes the outsider the actor. Any doubt, an API error included,
      # lands on the side that asks a human.
      - name: Decide whether publishing needs a maintainer's approval
        id: trust
        if: steps.meta.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.meta.outputs.pr }}
          AUTHOR: ${{ steps.meta.outputs.author }}
          ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: |
          # "permission" folds maintain into write and triage into read.
          can_write() {
            p=$(gh api "repos/$REPO/collaborators/$1/permission" --jq .permission 2>/dev/null) || p=unknown
            echo "$1: $p" >&2
            [ "$p" = admin ] || [ "$p" = write ]
          }
          if can_write "$AUTHOR" && can_write "$ACTOR"; then
            env=gno-previews
          else
            env=gno-previews-review
            # A job naming an environment that does not exist creates it, with
            # no protection at all. Refuse rather than publish unreviewed.
            rules=$(gh api "repos/$REPO/environments/$env" --jq '[.protection_rules[]?.type] | join(",")' 2>/dev/null) || rules=
            case ",$rules," in
              *,required_reviewers,*) ;;
              *) echo "::error::environment $env has no required reviewers (rules: '${rules:-none}'); refusing to publish PR #$PR"
                 exit 1 ;;
            esac
          fi
          echo "environment=$env" >> "$GITHUB_OUTPUT"
          {
            echo "PR #$PR by @$AUTHOR, run triggered by @$ACTOR → \`$env\`"
            [ "$env" = gno-previews ] || echo "Approving publishes this pull request's rendered pages, script included, on gnolang.github.io."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: resolve
    if: needs.resolve.outputs.pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ needs.resolve.outputs.environment }}
    permissions:
      pull-requests: write # to upsert the sticky comment
      actions: read # to download the artifact from the triggering run
      contents: read # to check out this repository's own gnopreview
    env:
      PR: ${{ needs.resolve.outputs.pr }}
    steps:
      # An approval can come days after the render. Publishing a snapshot of a
      # commit the pull request has since left, or of a closed one, would show
      # reviewers something that is no longer proposed.
      - name: Check the pull request has not moved
        id: fresh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          now=$(gh api "repos/$REPO/pulls/$PR" --jq 'if .state == "open" then .head.sha else "closed" end')
          if [ "$now" != "$HEAD_SHA" ]; then
            echo "PR #$PR is at $now, not $HEAD_SHA: nothing to publish"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Download the snapshot
        if: steps.fresh.outputs.ok
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-preview
          path: _preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The default branch's gnopreview, never the pull request's: it is what
      # turns the untrusted preview.json into the text the bot posts.
      - name: Check out gnopreview from the default branch
        if: steps.fresh.outputs.ok
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: misc/gnopreview
          persist-credentials: false
          path: trusted

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: steps.fresh.outputs.ok
        with:
          go-version-file: trusted/misc/gnopreview/go.mod
          cache: false # a privileged job restores no cache a pull request could have written

      # Built before anything is pushed, so a preview.json the trusted code
      # refuses publishes nothing at all rather than pages with no comment.
      - name: Build the comment
        if: steps.fresh.outputs.ok
        working-directory: trusted/misc/gnopreview
        env:
          BASE_URL: ${{ vars.GNOWEB_PREVIEW_BASE_URL }}/pr-${{ needs.resolve.outputs.pr }}
        run: go run . comment -snapshot "$GITHUB_WORKSPACE/_preview" -base-url "$BASE_URL" -pr "$PR" > "$RUNNER_TEMP/comment.md"

      # A separate repository needs a credential of its own: GITHUB_TOKEN is scoped to
      # this one. A deploy key rather than a PAT — it cannot reach any repository but
      # gno-previews, it does not expire, and it carries no personal identity, so preview
      # commits are not attributed to whoever minted it. Credentials are persisted
      # because pushing is the point, and this job uploads no artifact to leak them into.
      - name: Check out the previews repository
        if: steps.fresh.outputs.ok
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0 # zizmor: ignore[artipacked]
        with:
          repository: ${{ env.PREVIEWS_REPO }}
          ref: main
          ssh-key: ${{ secrets.PREVIEWS_DEPLOY_KEY }}
          path: previews

      # Concurrent pull requests share one branch, each owning only its own pr-<N>/, so a
      # parallel push makes ours non-fast-forward. Rather than rebase, replay: reset onto
      # the latest main and redo the copy. It only ever rewrites our own directory plus
      # the generated index, so replaying is idempotent and cannot clobber another PR.
      - name: Publish pr-<N>
        if: steps.fresh.outputs.ok
        working-directory: previews
        env:
          # Worst case measured is 8.8 MiB and about 140 files; these are headroom.
          MAX_PREVIEW_MIB: "20"
          MAX_PREVIEW_FILES: "1000"
          # GitHub Pages refuses a site over 1 GB. gno-previews' evict.yml trims to
          # 700 MiB once a day; this stops a burst between two sweeps getting there.
          MAX_SITE_MIB: "900"
        run: |
          # The artifact comes from a job running the pull request's own code.
          # A .git inside it makes `git add -A` record pr-<N> as a gitlink
          # (mode 160000, reproduced), which GitHub Pages reports as a build
          # error — and a failed build stops publishing for every preview, not
          # just this one.
          find ../_preview -name .git -prune -exec rm -rf {} +
          # Apparent size, because du otherwise charges an empty file nothing,
          # and a file count for the same reason.
          size=$(du -sm --apparent-size ../_preview | cut -f1)
          files=$(find ../_preview -type f | wc -l)
          if [ "$size" -gt "$MAX_PREVIEW_MIB" ] || [ "$files" -gt "$MAX_PREVIEW_FILES" ]; then
            echo "::error::preview is ${size} MiB in ${files} files, over the ${MAX_PREVIEW_MIB} MiB / ${MAX_PREVIEW_FILES} file cap"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            rm -rf "pr-$PR"
            mkdir -p "pr-$PR"
            cp -r ../_preview/. "pr-$PR/"
            site=$(du -sm --apparent-size --exclude=.git . | cut -f1)
            if [ "$site" -gt "$MAX_SITE_MIB" ]; then
              echo "::error::the previews site would be ${site} MiB, over ${MAX_SITE_MIB} MiB; evict.yml in $PREVIEWS_REPO frees space daily"
              exit 1
            fi
            git add -A
            if git diff --cached --quiet; then
              echo "preview unchanged"
              exit 0
            fi
            git commit -q -m "preview: PR #$PR"
            if git push -q origin HEAD:main; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "push rejected (main moved); replaying on the latest — attempt $attempt"
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::could not publish the preview after 5 attempts"
          exit 1

      - name: Upsert the sticky comment
        if: steps.fresh.outputs.ok
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          body="$RUNNER_TEMP/comment.md"
          [ -s "$body" ] || { echo "no comment body — nothing to post"; exit 0; }
          # Match the bot's own comment, not merely the marker: anyone can post
          # a comment containing it, and this would then edit theirs forever.
          marker='<!-- gnoweb-pr-preview -->'
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq ".[] | select(.user.login == \"github-actions[bot]\")
                          | select(.body | contains(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" >/dev/null
            echo "updated comment $id"
          else
            gh api "repos/$REPO/issues/$PR/comments" -F "body=@$body" >/dev/null
            echo "created comment"
          fi
