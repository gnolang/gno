name: ci / gnovm

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - gnovm/**
      - tm2/** # GnoVM has a dependency on TM2 types
      - examples/** # gnovm has some tests that depend on examples
      # We trigger the testing workflow for changes to the main go.mod,
      # since this can affect test results
      - go.mod
      - .github/workflows/ci-dir-gnovm.yml
      # *.md is prose, except in the gno source trees where it is valid
      # mempackage content (see gnovm/pkg/gnolang/mempackage.go goodFileXtns).
      # Order matters: a later positive pattern wins over an earlier negation.
      - '!**/*.md'
      - examples/**/*.md
      - gnovm/stdlibs/**/*.md
      # A package-local integration script is not mempackage content and no test
      # here reads one; the suite that runs them is ci-dir-gnoland. Excluding it
      # keeps a gas-number refresh from paying for this workflow too.
      - '!examples/**/*.txtar'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    uses: ./.github/workflows/_ci-go.yml
    with:
      modulepath: "gnovm"
      tests-extra-args: "-coverpkg=github.com/gnolang/gno/gnovm/..."
  stdlibs:
    uses: ./.github/workflows/_ci-gno.yml
    with:
      path: "gnovm/stdlibs"
