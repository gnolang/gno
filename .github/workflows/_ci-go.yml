# Reusable workflow for Go modules: lint + build + test with coverage.
#
# Go build cache: setup-go's cache is off (`cache: false`) in the CI
# workflows. It keys every job on go.sum alone, so whichever job finishes first
# saves the only entry, and that was often one that compiled nothing. Instead
# the jobs that compile most keep a build cache per job kind, restored from the
# newest one. Only runs on the default branch save it, after pruning what the
# run did not use (Go refreshes an entry's mtime when it is used): a pull
# request's cache could not be read by other pull requests and would only push
# the default branch's out of the repository's 10 GB. Modules are not cached;
# they download in seconds.
on:
  workflow_call:
    inputs:
      modulepath:
        required: true
        type: string
      tests-extra-args:
        required: false
        type: string
      tests-ts-seq:
        required: false
        type: boolean
      go-version:
        description: "Go version to use; defaults to the version in go.mod"
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          cache: false
      # Also holds golangci-lint's analysis cache, and the build cache of the
      # toolchain the `go fix` step uses.
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-lint-${{ inputs.modulepath }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-lint-${{ inputs.modulepath }}-
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: ${{ inputs.modulepath }}
          args: --config=${{ github.workspace }}/.github/golangci.yml
          version: v2.11.4 # sync with misc/devdeps and the other golangci-lint-action steps
          # Cached by the steps around this one.
          skip-cache: true
          # `config verify` downloads the JSONSchema from golangci-lint.run on
          # every lint job. That is a network dependency in the critical path:
          # when the fetch times out the job fails with a schema-loading error
          # that has nothing to do with the code under lint. The config is
          # already exercised by `golangci-lint run` itself, which rejects an
          # invalid file, so the schema check buys little and costs a flake.
          verify: false
      - name: Verify 'go fix' has been applied
        working-directory: ${{ inputs.modulepath }}
        env:
          # The modernizer-based `go fix` requires the Go 1.26+ toolchain. Only
          # this check is pinned to it; build/test/lint keep the go.mod version.
          # Fixes are still gated by each module's go.mod `go` directive.
          GOTOOLCHAIN: go1.26.1
          # Cover `//go:build cgo` files (e.g. tm2/pkg/db/lmdbdb, mdbxdb) so they
          # are checked here and by `make fix` alike, not silently skipped.
          CGO_ENABLED: "1"
        run: |
          # -omitzero=false: the omitzero modernizer strips `json:",omitempty"`
          # from struct-typed fields, assuming encoding/json semantics where it
          # is a no-op. Amino (used pervasively here) DOES honor omitempty on
          # struct fields, so removing it changes JSON output. Keep it disabled,
          # mirroring the modernizer's own carve-out for kubebuilder types.
          changes="$(go fix -omitzero=false -diff ./...)"
          if [ -n "$changes" ]; then
            echo "::error::'go fix' would modify files. Run 'make fix' from the repo root and commit the result."
            printf '%s\n' "$changes"
            exit 1
          fi
      - name: Prune Go cache to what this run used
        if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
        run: find ~/.cache/go-build ~/.cache/golangci-lint -type f -mmin +120 -delete
      - name: Save Go cache
        if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          cache: false
      - name: Check generated files are up to date
        working-directory: ${{ inputs.modulepath }}
        run: |
          if make -qp | grep -q '^generate:'; then
            make generate
            if [ "$(git status -s)" != "" ]; then
              echo "command 'make generate' creates files that differ from the git tree, please run 'make generate' and commit:"
              git status -s
              git diff
              exit 1
            fi
          else
            echo "'make generate' rule not found, skipping."
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          cache: false
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}-test-${{ inputs.modulepath }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-test-${{ inputs.modulepath }}-
      - name: Go test
        working-directory: ${{ inputs.modulepath }}
        env:
          SEQ_TS: ${{ inputs.tests-ts-seq }}
          TXTARCOVERDIR: /tmp/txtarcoverdir
          GOCOVERDIR: /tmp/gocoverdir
          COVERDIR: /tmp/coverdir
          INPUTS_MODULEPATH: ${{ inputs.modulepath }}
          INPUTS_TESTS_EXTRA_ARGS: ${{ inputs.tests-extra-args }}
        run: |
          set -x

          mkdir -p "$GOCOVERDIR" "$TXTARCOVERDIR" "$COVERDIR"

          export filter="-pkg=github.com/gnolang/gno/${INPUTS_MODULEPATH}/..."

          # INPUTS_TESTS_EXTRA_ARGS must word-split into flags
          # shellcheck disable=SC2086
          go test -covermode=set -timeout 30m ${INPUTS_TESTS_EXTRA_ARGS} ./... -test.gocoverdir="$GOCOVERDIR"

          (set +x; echo 'go coverage results:')
          go tool covdata percent "$filter" -i="$GOCOVERDIR"
          (set +x; echo 'txtar coverage results:')
          go tool covdata percent "$filter" -i="$TXTARCOVERDIR"
      - name: Prune Go cache to what this run used
        if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
        run: find ~/.cache/go-build -type f -mmin +120 -delete
      - name: Save Go cache
        if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
