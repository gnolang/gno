# The UPGRADES.md table of every misc/deployments/<chain>/ is rendered from
# that chain's upgrades.json by render-upgrades.sh. A hand-edited or forgotten
# table is what this catches: the JSON is what a replaying node reads, the
# table is what an operator reads, and they must say the same thing.
name: ci / upgrades-ledger

on:
  push:
    branches:
      - master
      - chain/*
    paths:
      - misc/deployments/*/upgrades.json
      - misc/deployments/*/UPGRADES.md
      - misc/deployments/*/render-upgrades.sh
      - .github/workflows/ci-upgrades-ledger.yml
  pull_request:
    paths:
      - misc/deployments/*/upgrades.json
      - misc/deployments/*/UPGRADES.md
      - misc/deployments/*/render-upgrades.sh
      - .github/workflows/ci-upgrades-ledger.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Rendered tables match their upgrades.json
        run: |
          for script in misc/deployments/*/render-upgrades.sh; do
            echo "== ${script}"
            "${script}" --check
          done
