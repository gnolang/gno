# Reusable workflow for Gno packages/realms: fmt + lint + test.
on:
  workflow_call:
    inputs:
      path:
        description: "Path to run gno tools on"
        required: true
        type: string
      go-version:
        description: "Go version to use; defaults to the version in go.mod"
        required: false
        type: string
        default: ""
      debug:
        description: "Enable debug logs"
        required: false
        type: boolean
      run-fmt:
        description: "Run gno fmt"
        required: false
        type: boolean
        default: true
      run-lint:
        description: "Run gno lint"
        required: false
        type: boolean
        default: true
      run-test:
        description: "Run gno test"
        required: false
        type: boolean
        default: true

permissions: {}

# Every job here starts by compiling the gno binary (`go run ./gnovm/cmd/gno`).
# The test job saves that build to a cache on the default branch (see "Go build
# cache" in _ci-go.yml) and the other jobs, here and in ci-dir-examples.yml,
# restore it.
jobs:
  fmt:
    name: fmt
    if: inputs.run-fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          cache: false
      - name: Restore Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}-gno-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-gno-
      - run: go run ./gnovm/cmd/gno -C "${INPUTS_PATH}" fmt -diff ./...
        env:
          INPUTS_PATH: ${{ inputs.path }}

  lint:
    name: lint
    if: inputs.run-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          cache: false
      - name: Restore Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}-gno-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-gno-
      - run: go run ./gnovm/cmd/gno lint -C "${INPUTS_PATH}" -v ./...
        env:
          INPUTS_PATH: ${{ inputs.path }}

  test:
    name: test
    if: inputs.run-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}
          cache: false
      - name: Restore Go cache
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}-gno-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-gno-

      - name: Setup debug env
        if: inputs.debug
        run: |
          export LOG_PATH_DIR="${RUNNER_TEMP}/logs"
          mkdir -p "$LOG_PATH_DIR"
          echo "LOG_LEVEL=debug" >> "$GITHUB_ENV"
          echo "LOG_PATH_DIR=$LOG_PATH_DIR" >> "$GITHUB_ENV"

      - name: Run gno test
        run: go run ./gnovm/cmd/gno test -C "${INPUTS_PATH}" -v -print-runtime-metrics -print-events ./...
        env:
          INPUTS_PATH: ${{ inputs.path }}

      # Both callers (examples, gnovm/stdlibs) build the same binary, so
      # whichever saves first is as good as the other; the second save is
      # refused as a duplicate key and only logs a warning.
      - name: Prune Go cache to what this run used
        if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
        run: find ~/.cache/go-build -type f -mmin +120 -delete
      - name: Save Go cache
        if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
