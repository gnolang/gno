name: ci / e2e

on:
  # No path filter on push: develop always gets the full suite.
  push:
    branches: [ develop ]
  # Unlike the other ci-* workflows this one filters PRs by base branch, so it
  # has to list the bases used here: develop, and dev/** for stacked PRs.
  pull_request:
    branches: [ develop, 'dev/**' ]
    paths:
      - .github/workflows/ci-e2e.yml
      - misc/e2e/**
      - Dockerfile
      - gno.land/**
      - gnovm/**
      - tm2/**
      - examples/**
      - go.mod
      - go.sum
      # *.md is prose, except in the gno source trees where it is valid
      # mempackage content (see gnovm/pkg/gnolang/mempackage.go goodFileXtns).
      # Order matters: a later positive pattern wins over an earlier negation.
      - '!**/*.md'
      - examples/**/*.md
      - gnovm/stdlibs/**/*.md

permissions:
  contents: read

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    
    - name: Run E2E tests
      run: |
        cd misc/e2e
        docker compose version
        docker compose build
        docker compose up --abort-on-container-exit --exit-code-from gnokey-test
