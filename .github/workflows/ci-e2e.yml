name: ci / e2e

on:
  # No path filter on push: master always gets the full suite.
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    paths:
      - .github/workflows/ci-e2e.yml
      - misc/e2e/**
      - Dockerfile
      - gno.land/**
      - gnovm/**
      - tm2/**
      - examples/**
      - go.mod
      - go.sum
      # *.md is prose, except in the gno source trees where it is valid
      # mempackage content (see gnovm/pkg/gnolang/mempackage.go goodFileXtns).
      # Order matters: a later positive pattern wins over an earlier negation.
      - '!**/*.md'
      - examples/**/*.md
      - gnovm/stdlibs/**/*.md

permissions:
  contents: read

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    
    - name: Run E2E tests
      run: |
        cd misc/e2e
        docker compose version
        docker compose build
        docker compose up --abort-on-container-exit --exit-code-from gnokey-test
