# tests the "misc" directory & tools
# (not meant for miscellaneous workflows)
name: ci / misc

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - misc/**
      - .github/workflows/ci-dir-misc.yml
      # This only runs `go test` on the Go programs under misc/, so every
      # *.md under it is prose (misc/deployments/, misc/val-scenarios/, ...).
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        # Fixed list, because misc/ also holds non-Go directories that a glob
        # would pick up. ci-dir-contribs.yml can glob contribs/* for that
        # reason and this one cannot.
        #
        # The cost is silence: a Go program under misc/ that is not listed here
        # is simply never built, with nothing to say so. Some are covered
        # elsewhere instead — genproto2 by a job in ci-codegen-verify,
        # multiarch-determinism by its own workflow, and stdlib_diff by
        # deploy-pages, which runs its generator on pull requests touching it.
        # A new one with neither is untested from its first commit.
        program:
          - audit-pattern-harness
          - autocounterd
          - genproto
          - genstd
          - goscan
          - loop
    name: ${{ matrix.program }}
    uses: ./.github/workflows/_ci-go.yml
    with:
      modulepath: misc/${{ matrix.program }}
      tests-extra-args: "-coverpkg=github.com/gnolang/gno/misc/..."
