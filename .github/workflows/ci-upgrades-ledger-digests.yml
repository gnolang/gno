# The upgrade ledgers record, for every version a network has run, the digest
# its gnoland image tag resolved to, the image it actually ran when that
# differs (ran_as), and the sha256 of every release binary. A re-pushed tag, a
# replaced release asset or a registry clean-up changes those silently. This
# checks each recorded value against the registry and the release, reports
# every difference, and fails at the end. Read-only, public data.
name: ci / upgrades-ledger-digests

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Recorded values still match the registry and the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          ledgers=(misc/deployments/*/upgrades.json)
          [ "${#ledgers[@]}" -gt 0 ] || { echo "::error::no ledger matches misc/deployments/*/upgrades.json"; exit 1; }
          status=0
          checked=0
          fail() { echo "::error::$*"; status=1; }
          for ledger in "${ledgers[@]}"; do
            echo "== ${ledger}"
            # One line per recorded value: what it is, then what to check.
            # Read in full first: a jq error inside a process substitution
            # would be swallowed and the ledger skipped as if it were empty.
            values="$(jq -r '
              .upgrades[]
              | (select(.image.digest != null) | "image \(.image.ref) \(.image.digest)"),
                (select(.ran_as != null) | "ran_as \(.image.ref) \(.ran_as)"),
                (.binaries | to_entries[] | "binary \(.value)")
            ' "${ledger}" 2>&1)" || { fail "${ledger}: cannot read the ledger: ${values}"; continue; }
            while read -r kind a b; do
              [ -n "${kind}" ] || continue
              checked=$((checked + 1))
              case "${kind}" in
              image)
                if ! out="$(docker buildx imagetools inspect "${a}" --format '{{json .Manifest}}' 2>&1)"; then
                  fail "${ledger}: cannot resolve ${a}: ${out}"
                  continue
                fi
                actual="$(jq -r .digest <<<"${out}")"
                if [ "${actual}" = "${b}" ]; then
                  echo "   ok  image   ${a} ${b}"
                else
                  fail "${ledger}: ${a} is recorded as ${b} but the registry serves ${actual}"
                fi
                ;;
              ran_as)
                # Untagged or on a mutable sha- tag, so a registry clean-up
                # can take it: the ledger is the only record of what ran.
                ref="${a%:*}@${b}"
                if out="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' 2>&1)"; then
                  echo "   ok  ran_as  ${ref}"
                else
                  fail "${ledger}: ran_as ${ref} no longer resolves: ${out}"
                fi
                ;;
              binary)
                # https://github.com/<owner>/<repo>/releases/download/<tag>/<asset>?checksum=sha256:<hex>
                url="${a%%\?*}"
                want="sha256:${a##*checksum=sha256:}"
                IFS=/ read -r owner repo releases download tag asset <<<"${url#https://github.com/}"
                if [ "${releases}/${download}" != "releases/download" ] || [ -z "${asset}" ]; then
                  fail "${ledger}: not a release download URL: ${a}"
                  continue
                fi
                if ! actual="$(gh api "repos/${owner}/${repo}/releases/tags/${tag}" \
                  --jq ".assets[] | select(.name == \"${asset}\") | .digest" 2>&1)"; then
                  fail "${ledger}: cannot read release ${tag}: ${actual}"
                  continue
                fi
                if [ "${actual}" = "${want}" ]; then
                  echo "   ok  binary  ${tag}/${asset}"
                else
                  fail "${ledger}: ${tag}/${asset} is recorded as ${want} but the release serves ${actual:-nothing}"
                fi
                ;;
              esac
            done <<<"${values}"
          done
          [ "${checked}" -gt 0 ] || { echo "::error::nothing in the ledgers was checked"; exit 1; }
          exit "${status}"
